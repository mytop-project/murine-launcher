// Murine as an app: the launcher library (the root project) with its Home entry. Built by the fork's CI to check
// the launcher builds and runs without droidtop (Droidtop/tracker#921); it is not released.
// By id alone: the root project (the launcher library) already put AGP and Kotlin on the classpath, and Gradle
// refuses a versioned request for a plugin already there (run 42287245323).
plugins {
    id 'com.android.application'
}

apply from: new File(rootProject.findProject(':shell-default')?.projectDir ?: rootProject.projectDir, 'gradle/kotlin-android.gradle')

android {
    namespace 'app.murinelauncher.app'
    compileSdk 36

    defaultConfig {
        applicationId 'app.murinelauncher.standalone'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':')
}

// Works with both the external Kotlin plugin and AGP 9 built-in Kotlin.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}
