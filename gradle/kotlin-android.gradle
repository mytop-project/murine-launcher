// AGP 9 supplies Kotlin. The standalone launcher still supports its pinned AGP 8 build; only that build (or an
// explicit AGP 9 opt-out) applies the external Kotlin Android plugin. Every module uses this one decision.
// Applied scripts have their own classloader; resolve AGP through its applied plugin.
def androidPlugin = plugins.findPlugin('com.android.library') ?: plugins.findPlugin('com.android.application')
def agpVersion = androidPlugin.class.classLoader.loadClass('com.android.Version')
        .getField('ANDROID_GRADLE_PLUGIN_VERSION').get(null)
def agpMajor = agpVersion.tokenize('.')[0].toInteger()
def builtInKotlin = agpMajor >= 9 && providers.gradleProperty('android.builtInKotlin').orNull != 'false'
if (!builtInKotlin) {
    pluginManager.apply('org.jetbrains.kotlin.android')
}
