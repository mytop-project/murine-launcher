plugins {
    id 'com.android.library'
}

apply from: new File(rootProject.findProject(':shell-default')?.projectDir ?: rootProject.projectDir, 'gradle/kotlin-android.gradle')

android {
    namespace = "com.android.settingslib.widget.preference.segmentedbutton"
    compileSdk = 36

    defaultConfig {
        minSdk = 26
    }

    sourceSets {
        getByName("main") {
            java.srcDirs("src")
            kotlin.directories.add("src")
            res.srcDirs("res")
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

}

dependencies {
    api project(':SettingsLib-SettingsTheme')
    implementation(libs.annotation)
    implementation(libs.androidx.preference)
}

// Added by droidtop's fork (not upstream Murine) — see shell-default/
// build.gradle's own header comment for why this can't be injected
// centrally from there.
def _frameworkStubs = project.configurations.detachedConfiguration(
        project.dependencies.create("com.github.alesimula:android-framework-stubs:16-r2")
)
_frameworkStubs.transitive = false
dependencies {
    compileOnly project.files(_frameworkStubs.resolve())
    implementation libs.androidx.core.ktx
    implementation libs.annotation
    implementation libs.kotlinx.coroutines
}

// Works with both the external Kotlin plugin and AGP 9 built-in Kotlin.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}
